site_name: ZCETHAN's Blog
site_url: https://zc-ethan.github.io/CKCmix/
site_author: ZCETHAN
repo_url: https://github.com/Zc-Ethan/CKCmix
repo_name: Zc-Ethan/CKCmix
theme:
  favicon: assets/logo.png
  icon:
    logo: material/material-ui
    repo: fontawesome/brands/github
  name: material
  language: zh
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
      accent: light green
      primary: teal

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
      accent: amber
      primary: brown
  features:
    - toc.follow
    - navigation.tabs
    - navigation.prune
    - navigation.top
    - navigation.footer
    - content.tooltips


markdown_extensions:
  # ===== 核心修改：删除 'pymdownx.extra'，改为显式声明基础扩展 =====
  - tables        # 支持表格
  - admonition    # 支持警告框
  - footnotes     # 支持脚注
  - attr_list     # 支持属性列表
  - def_list      # 支持定义列表
  - md_in_html    # 支持在HTML标签内写Markdown
  - toc:          # 支持目录，并启用永久链接
      permalink: true
  # ===== 你原有且需要的 pymdownx 增强扩展 (确保不重复) =====
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  # !!! 重要：snippets 只保留下面这一个带配置的 !!!
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde


site_name: ZCETHAN's Blog
site_url: https://zc-ethan.github.io/CKCmix/
site_author: ZCETHAN
repo_url: https://github.com/Zc-Ethan/CKCmix
repo_name: Zc-Ethan/CKCmix

theme:
  favicon: assets/logo.png
  icon:
    logo: material/material-ui
    repo: fontawesome/brands/github
  name: material
  language: zh
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
      accent: light green
      primary: teal

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
      accent: amber
      primary: brown
  features:
    - toc.follow
    - navigation.tabs
    - navigation.prune
    - navigation.top
    - navigation.footer
    - content.tooltips
    - content.code.select
    - content.code.copy

# 数学公式支持：从 MathJax 切换到 KaTeX
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  # 基础扩展
  - tables
  - admonition
  - footnotes
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true

  # ===== 关键修改 1：修正 pymdownx.arithmatex 以启用 KaTeX =====
  - pymdownx.arithmatex:
      generic: true

  # ===== 关键修改 2：解决中文加粗问题 =====
  - pymdownx.betterem:
      smart_enable: all_except_midword  # 允许 **中文** 这种紧邻中文的加粗语法

  # 其他 pymdownx 增强扩展 (保持原有配置)
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - 个人主页: index.md
  - 食在浙大:
    - eat_in_zju/ZJGcampus.md
  - 大一秋冬:
    - G1auwi/lessonsummary.md
  - 大一春夏: 
    - G1spsu/gen_chem_exp.md
    - G1spsu/gen_phy_exp_1.md
  - 大二秋冬:
    - 高级数据结构与算法: 
      - G2auwi/ADS/13RandomizedAlgorithms.md
      - G2auwi/ADS/14ParallelAlgorithms.md
      - G2auwi/ADS/15ExternalSorting.md